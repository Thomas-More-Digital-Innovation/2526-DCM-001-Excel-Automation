services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_USER_FOLDER=/home/node/.n8n
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_JWT_SECRET}
      - NODE_FUNCTION_ALLOW_EXTERNAL=exceljs
      - NODE_FUNCTION_ALLOW_BUILTIN=https,http,url
      - N8N_DEFAULT_BINARY_DATA_MODE=default
      - N8N_BINARY_DATA_MODE=default
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - AKENEO_BASE_URL=${AKENEO_BASE_URL}
      - AKENEO_CLIENT_ID=${AKENEO_CLIENT_ID}
      - AKENEO_CLIENT_SECRET=${AKENEO_CLIENT_SECRET}
      - AKENEO_USERNAME=${AKENEO_USERNAME}
      - AKENEO_PASSWORD=${AKENEO_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    user: root
    entrypoint: /bin/sh -c "npm install -g exceljs && n8n start"

  portal:
    image: nginx:alpine
    container_name: dcm-portal
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./portal:/usr/share/nginx/html:ro
      - ./portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - n8n

volumes:
  n8n_data: